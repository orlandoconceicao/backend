<div class="main-content container">
    <form class="main-form" action="{{ form_action }}" method="POST" enctype="multipart/form-data">

        {% csrf_token %}

        <div class="form-content form-content-grid">
            {% for field in form %}
                <div class="form-group{% if 'span-2' in field.field.widget.attrs.class %} span-2{% endif %}">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}

                    {% if field.help_text %}
                        <p class="help-text">{{ field.help_text }}</p>
                    {% endif %}

                    {{ field.errors }}
                </div>
            {% endfor %}
        </div>

        {% if form.errors %}
            <div class="form-content form-content-grid">
                <div class="form-group">
                    <div class="message message-error">
                        Existem erros no formulário, corrija e envie novamente!
                    </div>
                </div>
            </div>
        {% endif %}

        <div class="form-content form-content-grid">
            <div class="form-group">
                <button class="submit">Enviar</button>
            </div>
        </div>

    </form>
</div>
