[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = tests.py test_*.py *_tests.py

addopts =
    --maxfail=1
    --disable-warnings
    -q
    --strict-markers
    # -rP

markers =
    slow: Run tests that are slow

    fast: Run fast tests

    functional_test: run tests that are selenium based
    # pytest -m 'functional_test' testa apenas a classe ou o teste sozinho
    # pytest -m 'not functional_test' testa todos menos oq tem esse marker
