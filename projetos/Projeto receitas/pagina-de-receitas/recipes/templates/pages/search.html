{% extends 'global/base.html' %}

{% block title %}
  {{page_title}} Recipes
{% endblock %}

{% block content %}

  <div class="main-content main-content-list container {% if not recipes %}no-recipes{% endif %}">

    {% for recipe in recipes %}
      {% include 'partials/recipes.html' %}
      {% empty %}
      <div class="empty-state">
        <h1>Nenhuma receita encontrada</h1>
      </div>
    {% endfor %}
    
  </div>

{% endblock %}
